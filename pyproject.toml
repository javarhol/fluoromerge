[project]
name = "fluoromerge"
version = "0.2.0"
description = "Drag-and-drop merging of single-channel fluorescence microscopy TIFFs into color composites with scale bars"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.1",
    "tkinterdnd2>=0.4",
]

[project.scripts]
fluoromerge = "fluoromerge.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["fluoromerge"]
